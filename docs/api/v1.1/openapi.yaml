openapi: 3.0.3
info:
  title: D1-Fabric Business API
  version: 1.1.0
  description: API-first MVP contract for Web, Android, iOS and mini-program clients.
servers:
  - url: https://api.example.com
paths:
  /api/v1/auth/register:
    post: {operationId: register, responses: {'201': {description: Created}}}
  /api/v1/auth/login:
    post: {operationId: login, responses: {'200': {description: OK}}}
  /api/v1/auth/refresh:
    post: {operationId: refresh, responses: {'200': {description: OK}}}
  /api/v1/auth/logout:
    post: {operationId: logout, security: [{bearerAuth: []}], responses: {'204': {description: Logged out}}}
  /api/v1/me:
    get: {operationId: getMe, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/users/{id}:
    get: {operationId: getUser, parameters: [{'$ref': '#/components/parameters/UserId'}], responses: {'200': {description: OK}, '404': {description: Not found}}}
  /api/v1/users/{id}/posts:
    get: {operationId: getUserPosts, parameters: [{'$ref': '#/components/parameters/UserId'}, {'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/posts:
    post: {operationId: createPost, security: [{bearerAuth: []}], responses: {'201': {description: Created}}}
  /api/v1/posts/{id}:
    get: {operationId: getPost, parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
    patch: {operationId: updatePost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
    delete: {operationId: deletePost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'204': {description: Deleted}}}
  /api/v1/posts/{id}/publish:
    post: {operationId: publishPost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/schedule:
    post: {operationId: schedulePost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/unpublish:
    post: {operationId: unpublishPost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/archive:
    post: {operationId: archivePost, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'200': {description: OK}}}
  /api/v1/posts/drafts:
    get: {operationId: listDrafts, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/posts/scheduled:
    get: {operationId: listScheduled, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/media/upload-authorizations:
    post: {operationId: authorizeMediaUpload, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/feed:
    get: {operationId: getFeed, parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/feed/following:
    get: {operationId: getFollowingFeed, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/feed/hot:
    get: {operationId: getHotFeed, parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/like:
    post: {operationId: likePost, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
    delete: {operationId: unlikePost, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/favorite:
    post: {operationId: favoritePost, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
    delete: {operationId: unfavoritePost, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/users/{id}/follow:
    post: {operationId: followUser, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
    delete: {operationId: unfollowUser, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/posts/{id}/comments:
    get: {operationId: listComments, parameters: [{'$ref': '#/components/parameters/PostId'}, {'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
    post: {operationId: createComment, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/PostId'}], responses: {'201': {description: Created}}}
  /api/v1/comments/{id}/like:
    post: {operationId: likeComment, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
    delete: {operationId: unlikeComment, security: [{bearerAuth: []}], responses: {'200': {description: OK}}}
  /api/v1/search:
    get: {operationId: search, parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}, {name: type, in: query, schema: {type: string, enum: [all, post, user], default: all}}, {'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/topics/{id}:
    get: {operationId: getTopic, responses: {'200': {description: OK}}}
  /api/v1/topics/{id}/posts:
    get: {operationId: getTopicPosts, parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/history:
    get: {operationId: getHistory, security: [{bearerAuth: []}], parameters: [{'$ref': '#/components/parameters/Cursor'}, {'$ref': '#/components/parameters/Limit'}], responses: {'200': {description: OK}}}
  /api/v1/history/events:
    post: {operationId: recordHistoryEvent, security: [{bearerAuth: []}], responses: {'201': {description: Recorded}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque}
  parameters:
    PostId: {name: id, in: path, required: true, schema: {type: string}}
    UserId: {name: id, in: path, required: true, schema: {type: string}}
    CommentId: {name: id, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}

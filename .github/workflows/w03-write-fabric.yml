name: W03 Write Fabric

on:
  push:
    paths:
      - 'workers/v2/W03-Write-Fabric/**'
      - '.github/workflows/w03-write-fabric.yml'
  pull_request:
    paths:
      - 'workers/v2/W03-Write-Fabric/**'
      - '.github/workflows/w03-write-fabric.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/v2/W03-Write-Fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/v2/W03-Write-Fabric/package-lock.json
      - run: npm ci
      - run: npm run validate-deployment
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run
      - name: Verify W03 boundary
        run: |
          ! grep -R -n -E 'from .*W0[1-2]|wrangler d1 execute|--d1|D1_DATABASE|D1_BINDING|env\.W02|env\.W04' src
          ! grep -R -n -E 'article|comment|feed|gallery|question|business logic|content platform' src

  production-target-attestation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/v2/W03-Write-Fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.130.0
      - name: Query Cloudflare D1 inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 list --json > /tmp/d1-inventory.json
      - name: Attest deployment identities
        env:
          D1_FABRIC_STRICT_DEPLOYMENT: '1'
        run: node scripts/validate-deployment-targets.mjs deployment/targets.json wrangler.toml /tmp/d1-inventory.json

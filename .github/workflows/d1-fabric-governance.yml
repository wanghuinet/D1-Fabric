name: D1-Fabric 3.2 Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-structure:
    name: Governance Structural Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate governance JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('.governance/3.2')
          required = [
              root/'config.json', root/'capabilities/registry.json', root/'adrs/registry.json',
              root/'ownership/registry.json', root/'dependencies/registry.json',
              root/'bindings/registry.json', root/'changes/schema.json', root/'changes/current.json',
              root/'evidence/schema.json', root/'evidence/freshness.json',
              root/'behavior/registry.json', root/'recovery/registry.json',
              root/'security/registry.json', root/'capacity/registry.json',
              Path('tools/governance/validate_change_manifest.py'),
              Path('tools/governance/validate_behavioral_governance.py'),
              Path('tools/governance/validate_recovery_registry.py'),
              Path('tools/governance/validate_security_governance.py'),
              Path('tools/governance/validate_capacity_governance.py'),
              Path('tools/governance/validate_evidence_freshness.py')
          ]
          for p in required:
              if not p.is_file(): raise SystemExit(f'MISSING_GOVERNANCE_FILE: {p}')
              if p.suffix == '.json': json.loads(p.read_text(encoding='utf-8'))
          print('Governance structure: PASS')

      - name: Machine governance gate
        shell: bash
        env:
          D1_FABRIC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/governance/validate_change_manifest.py

  governance-policy:
    name: Governance Policy Gate
    needs: governance-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce baseline topology
        shell: python
        run: |
          import json
          from pathlib import Path
          cfg = json.loads(Path('.governance/3.2/config.json').read_text(encoding='utf-8'))
          expected = ['W01','W02','W03','W04','W05','W06']
          if cfg['active_worker_topology'] != expected:
              raise SystemExit('WORKER_TOPOLOGY_DRIFT: explicit architecture admission required')
          if cfg['worker_addition_requires_adr'] is not True:
              raise SystemExit('WORKER_ADMISSION_POLICY_MISSING')
          if cfg['worker_addition_requires_change_manifest'] is not True:
              raise SystemExit('WORKER_CHANGE_MANIFEST_POLICY_MISSING')
          print('Baseline topology and worker admission policy: PASS')

  governance-behavior:
    name: Behavioral Governance Level 4 Gate
    needs: [governance-structure, governance-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute behavioral invariants
        shell: bash
        run: python tools/governance/validate_behavioral_governance.py

  governance-recovery:
    name: Recovery Governance Level 5 Gate
    needs: [governance-behavior, governance-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute recovery proofs
        shell: bash
        run: python tools/governance/validate_recovery_registry.py

  governance-security:
    name: Security and Tenant Isolation Gate
    needs: governance-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute security policy simulations
        shell: bash
        run: python tools/governance/validate_security_governance.py

  governance-capacity:
    name: Capacity and Operational Boundary Gate
    needs: governance-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute capacity boundary simulations
        shell: bash
        run: python tools/governance/validate_capacity_governance.py

  governance-evidence:
    name: Evidence Freshness Gate
    needs: [governance-security, governance-capacity]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute evidence freshness checks
        shell: bash
        run: python tools/governance/validate_evidence_freshness.py

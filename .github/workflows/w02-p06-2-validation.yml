name: W02 P06.2 Hardening Validation

on:
  push:
    paths:
      - "workers/v2/W02-Execution-Fabric/**"
      - "docs/phases/P06.2-W02-EXECUTION-HARDENING-v1.0.md"
      - "docs/phases/evidence/P06.2.1-EVIDENCE.md"
      - ".github/workflows/w02-p06-2-validation.yml"
  pull_request:
    paths:
      - "workers/v2/W02-Execution-Fabric/**"
      - "docs/phases/P06.2-W02-EXECUTION-HARDENING-v1.0.md"
      - "docs/phases/evidence/P06.2.1-EVIDENCE.md"
      - ".github/workflows/w02-p06-2-validation.yml"
  workflow_dispatch:

jobs:
  validate-w02-p06-2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/v2/W02-Execution-Fabric
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: workers/v2/W02-Execution-Fabric/package-lock.json

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test

      - name: npm run dry-run
        run: npm run dry-run

      - name: Verify W02 hardening surface
        run: |
          if grep -RInE "(\.batch\(|\.exec\(|wrangler d1|\b(INSERT|UPDATE|DELETE|REPLACE)\b)" src tests; then
            echo "Forbidden write or direct wrangler D1 surface detected in W02"
            exit 1
          fi
          if grep -RInE "(physicalDatabaseId|physicalShardId|sqlTopology|workerGraph)" src tests; then
            echo "Forbidden topology surface detected in W02"
            exit 1
          fi
          if grep -RIn "Promise.all(" src tests; then
            echo "Forbidden Promise.all surface detected in W02"
            exit 1
          fi
          grep -RIn "Promise.allSettled" src/scheduler.ts
          grep -RIn "rows_read" src/read.ts tests/read.test.ts

      - name: Emit exact verification marker
        run: |
          echo "W02_P06_2_VALIDATION=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "NODE_VERSION=$(node --version)"
          echo "NPM_VERSION=$(npm --version)"
